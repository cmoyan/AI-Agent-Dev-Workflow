name: Build OpenClaw Acceptance Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Build exact OpenClaw runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/runtime
          cd out/runtime
          npm init -y >/dev/null
          npm install --save-exact openclaw@2026.9.5
          node node_modules/openclaw/openclaw.mjs --version | tee ../openclaw-version.txt
          npm ls --depth=0 --json > ../npm-ls-depth0.json
          node -p "process.version" > ../node-version.txt
          cd ..
          tar -czf openclaw-runtime-node_modules.tar.gz runtime
          sha256sum openclaw-runtime-node_modules.tar.gz > openclaw-runtime-node_modules.tar.gz.sha256
      - name: Upload acceptance bundle
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026.9.5-runtime-bundle
          path: |
            out/openclaw-runtime-node_modules.tar.gz
            out/openclaw-runtime-node_modules.tar.gz.sha256
            out/openclaw-version.txt
            out/node-version.txt
            out/npm-ls-depth0.json
          if-no-files-found: error
          retention-days: 7

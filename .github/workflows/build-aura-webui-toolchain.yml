name: Build Aura WebUI Toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-aura-webui-toolchain.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Resolve exact WebUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/toolchain
          cd out/toolchain
          cat > package.json <<'JSON'
          {
            "name": "aura-webui-toolchain",
            "private": true,
            "version": "2.0.0-dev.9",
            "type": "module",
            "dependencies": {
              "antd": "6.6.4",
              "gsap": "3.13.0",
              "react": "19.2.0",
              "react-dom": "19.2.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "6.1.1",
              "vite": "8.2.2"
            }
          }
          JSON
          npm install --ignore-scripts=false --audit=false --fund=false
          npm ls --depth=0 --json > npm-ls-depth0.json
          node -p "process.version" > node-version.txt
          cd ..
          tar -czf aura-webui-node_modules.tar.gz toolchain/node_modules
          cp toolchain/package-lock.json .
          cp toolchain/package.json resolved-package.json
          cp toolchain/npm-ls-depth0.json .
          cp toolchain/node-version.txt .
          sha256sum aura-webui-node_modules.tar.gz package-lock.json resolved-package.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aura-webui-toolchain-dev9
          path: |
            out/aura-webui-node_modules.tar.gz
            out/package-lock.json
            out/resolved-package.json
            out/npm-ls-depth0.json
            out/node-version.txt
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

name: Poster2PSD V2 Alpha Dual Regression

on:
  push:
    branches: [ poster2psd-v2-bootstrap ]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/poster2psd-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-exe-regression:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate and verify canonical alpha.6 source tree
        shell: pwsh
        run: |
          # Alpha.6 uses one complete deterministic canonical source snapshot.
          # This replaces the alpha.3 -> alpha.4 -> alpha.6 overlay chain for future stability.
          $names = @(
            'source_00.b64',
            'source_01.b64',
            'source_02.b64',
            'source_03.b64'
          )
          $parts = foreach ($name in $names) {
            $path = Join-Path $env:GITHUB_WORKSPACE ("bootstrap\alpha6\" + $name)
            if (!(Test-Path $path)) { throw "Missing alpha.6 source chunk: $name" }
            Get-Content $path -Raw
          }
          $b64 = $parts -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.6-canonical.tar.xz'
          [System.IO.File]::WriteAllBytes($archive, [System.Convert]::FromBase64String($b64))

          $archiveActual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveExpected = 'f5f3c4a38174cf2317b93c73c3760887294adab8900acb7782cd13c4fbf0dda0'
          if ($archiveActual -ne $archiveExpected) { throw "Alpha.6 canonical archive hash mismatch: $archiveActual" }

          tar -xf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "alpha.6 canonical extraction failed: $LASTEXITCODE" }

          $sourceRoot = "$env:GITHUB_WORKSPACE\projects\Poster2PSD-V2"

          # Apply the alpha.6 r2 compile-only overlay after snapshot extraction.
          $fixPath = "$env:GITHUB_WORKSPACE\bootstrap\alpha6\alpha6-r2-fix.ps1"
          $fixText = (Get-Content $fixPath -Raw).Replace("`r`n", "`n")
          $fixBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($fixText)
          $fixActual = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($fixBytes)).ToLowerInvariant()
          $fixExpected = '80c0df200c8fd781f36b02fb7013aaacfc66cf05cbbcd17c8f847eb9fe06c89c'
          if ($fixActual -ne $fixExpected) { throw "Alpha.6 r2 fix hash mismatch: $fixActual" }
          & $fixPath -SourceRoot $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw "alpha.6 r2 source fix failed: $LASTEXITCODE" }

          # Apply alpha.6 r3 weighted prompt parser correction.
          $r3Path = "$env:GITHUB_WORKSPACE\bootstrap\alpha6\alpha6-r3-prompt-fix.ps1"
          $r3Text = (Get-Content $r3Path -Raw).Replace("`r`n", "`n")
          $r3Bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($r3Text)
          $r3Actual = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($r3Bytes)).ToLowerInvariant()
          $r3Expected = '2c7d0427aaea175711ce16c2b6ea6f4d57a4ad167923c62beb3cecf9b4671a83'
          if ($r3Actual -ne $r3Expected) { throw "Alpha.6 r3 fix hash mismatch: $r3Actual" }
          & $r3Path -SourceRoot $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw "alpha.6 r3 source fix failed: $LASTEXITCODE" }

          $fileCount = (Get-ChildItem $sourceRoot -File -Recurse).Count
          if ($fileCount -ne 90) { throw "Expected 90 canonical alpha.6 source files, found $fileCount" }
          if (!(Test-Path "$sourceRoot\Poster2PSD.sln")) { throw 'Poster2PSD.sln missing' }
          $versionText = (Get-Content "$sourceRoot\05_RELEASE\VERSION.txt" -Raw).Trim()
          if ($versionText -ne '0.1.0-alpha.6') { throw "Unexpected product version: $versionText" }

          $descriptor = "$archiveActual`n$fixActual`n$r3Actual`n"
          $descriptorBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($descriptor)
          $sourceFingerprint = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($descriptorBytes)).ToLowerInvariant()
          $fingerprintExpected = '0999413f0804d650f35afe8ac55f2206cce17511f5278ce0b5bc6d59d7bedf17'
          if ($sourceFingerprint -ne $fingerprintExpected) { throw "Source fingerprint mismatch: $sourceFingerprint" }

          # 04_TEST is a generated regression-evidence staging directory and can be empty in the canonical file snapshot.
          New-Item "$sourceRoot\04_TEST" -ItemType Directory -Force | Out-Null

          "POSTER2PSD_SOURCE_SHA256=$sourceFingerprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CANONICAL_SOURCE_FILE_COUNT=$fileCount"
          Write-Host "CANONICAL_SOURCE_FINGERPRINT=$sourceFingerprint"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: SOURCE REGRESSION
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\source-regression.ps1

      - name: Build Windows self-contained release payload
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\build-release.ps1 -Version '0.1.0-alpha.6' -SourceSnapshotSha256 $env:POSTER2PSD_SOURCE_SHA256

      - name: EXE ARTIFACT REGRESSION
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\smoke-binaries.ps1 -Version '0.1.0-alpha.6'

      - name: Development Package source plus EXE validation
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\validate-package.ps1 -Version '0.1.0-alpha.6' -SourceSnapshotSha256 $env:POSTER2PSD_SOURCE_SHA256

      - name: Collect regression evidence
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: |
          New-Item .\04_TEST\logs -ItemType Directory -Force | Out-Null
          @"
          # Alpha 0.1.0-alpha.6 Dual Regression Report

          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_RUN_ID
          Canonical source fingerprint: $env:POSTER2PSD_SOURCE_SHA256

          ## Source regression
          | Gate | Status |
          |---|---|
          | Canonical alpha.6 snapshot + r2 System.IO + r3 weighted-prompt overlays / 90-file count | PASS |
          | JSON / XML / XAML parse | PASS |
          | UXP JavaScript syntax | PASS |
          | .NET 10 restore | PASS |
          | NuGet vulnerable dependency audit | PASS |
          | Release solution build, warnings as errors | PASS |
          | xUnit tests | PASS |

          ## EXE artifact regression
          | Gate | Status |
          |---|---|
          | win-x64 self-contained publish | PASS |
          | 9 Windows PE executable checks | PASS |
          | 9 executable self-tests | PASS |
          | ProductVersion alpha.6 checks | PASS |
          | root/payload binary hash parity | PASS |
          | isolated fresh install | PASS |
          | stable Launcher probe | PASS |
          | repair | PASS |
          | uninstall | PASS |
          | user data preservation sentinel | PASS |
          | FILE-HASHES.sha256 recomputation | PASS |
          | source + EXE manifest batch match | PASS |

          ## Physical-host gates
          | Gate | Status |
          |---|---|
          | Photoshop real UXP handshake | NOT VERIFIED — GitHub runner has no Photoshop |
          | Photoshop real PSD create/modify/open/save/reopen | NOT VERIFIED — GitHub runner has no Photoshop |
          | External OCR/segmentation/matting/layout engine interface | IMPLEMENTED — production engines NOT INSTALLED on GitHub runner |
          | Prompt / preprocess / Provider Adapter runtime | IMPLEMENTED — real Provider adapter/API and ControlNet model NOT INSTALLED on GitHub runner |
          | Signed updater / rollback | NOT IMPLEMENTED — S0 hardening pending |
          "@ | Set-Content .\04_TEST\regression-report.md -Encoding utf8

      - name: Clean generated source outputs before packaging
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: |
          $generated = Get-ChildItem .\02_SOURCE -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj','TestResults') } | Sort-Object FullName -Descending
          foreach ($dir in $generated) {
            if (Test-Path $dir.FullName) { Remove-Item $dir.FullName -Recurse -Force }
          }
          $remaining = Get-ChildItem .\02_SOURCE -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj','TestResults') }
          if ($remaining) { throw 'Generated source outputs remain after cleanup.' }
          Write-Host 'Generated source outputs cleaned before delivery packaging.'

      - name: Assemble source and EXE delivery ZIPs
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: |
          $dev = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.6-Development-Package.zip'
          Compress-Archive -Path .\01_PLAN,.\02_SOURCE,.\03_BUILD,.\04_TEST,.\05_RELEASE,.\06_DOCS,.\Poster2PSD.sln,.\README.md,.\global.json,.\Directory.Build.props -DestinationPath $dev -Force
          Copy-Item $dev .\Poster2PSD-V2-0.1.0-alpha.6-Development-Package.zip

          # User-facing Windows bundle: installer + one payload copy only.
          # Full root/payload duplication remains in 03_BUILD for regression, but is not shipped twice.
          $exeStage = Join-Path $env:RUNNER_TEMP 'poster2psd-windows-installer-stage'
          Remove-Item $exeStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $exeStage -ItemType Directory -Force | Out-Null
          Copy-Item .\03_BUILD\Poster2PSD_Setup.exe (Join-Path $exeStage 'Poster2PSD_Setup.exe') -Force
          Copy-Item .\03_BUILD\payload (Join-Path $exeStage 'payload') -Recurse -Force
          $exe = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.6-Windows-EXE.zip'
          Compress-Archive -Path (Join-Path $exeStage '*') -DestinationPath $exe -Force
          Copy-Item $exe .\Poster2PSD-V2-0.1.0-alpha.6-Windows-EXE.zip

          $source = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.6-Source.zip'
          Compress-Archive -Path .\01_PLAN,.\02_SOURCE,.\05_RELEASE,.\06_DOCS,.\Poster2PSD.sln,.\README.md,.\global.json,.\Directory.Build.props -DestinationPath $source -Force
          Copy-Item $source .\Poster2PSD-V2-0.1.0-alpha.6-Source.zip

          Get-FileHash .\Poster2PSD-V2-0.1.0-alpha.6-*.zip -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content .\04_TEST\delivery-zip-hashes.txt

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Poster2PSD-V2-0.1.0-alpha.6-Source
          path: projects/Poster2PSD-V2/Poster2PSD-V2-0.1.0-alpha.6-Source.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: Poster2PSD-V2-0.1.0-alpha.6-Windows-EXE
          path: |
            projects/Poster2PSD-V2/Poster2PSD-V2-0.1.0-alpha.6-Windows-EXE.zip
            projects/Poster2PSD-V2/04_TEST/regression-report.md
            projects/Poster2PSD-V2/04_TEST/delivery-zip-hashes.txt
            projects/Poster2PSD-V2/05_RELEASE/BUILD-MANIFEST.json
            projects/Poster2PSD-V2/05_RELEASE/FILE-HASHES.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Development Package
        uses: actions/upload-artifact@v4
        with:
          name: Poster2PSD-V2-0.1.0-alpha.6-Development-Package
          path: projects/Poster2PSD-V2/Poster2PSD-V2-0.1.0-alpha.6-Development-Package.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

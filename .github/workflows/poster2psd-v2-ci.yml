name: Poster2PSD V2 Alpha Dual Regression

on:
  push:
    branches: [ poster2psd-v2-bootstrap ]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/poster2psd-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-exe-regression:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate and verify canonical alpha.2 source tree
        shell: pwsh
        run: |
          # Rehydrate the last canonical alpha.2 base archive.
          $names = 0..5 | ForEach-Object { "source_{0:d2}.b64" -f $_ }
          $parts = foreach ($name in $names) {
            $path = Join-Path $env:GITHUB_WORKSPACE ("bootstrap\" + $name)
            if (!(Test-Path $path)) { throw "Missing source chunk: $name" }
            Get-Content $path -Raw
          }
          $b64 = $parts -join ''
          $archive = Join-Path $env:GITHUB_WORKSPACE 'Poster2PSD-V2-alpha.2-base.tar.xz'
          [System.IO.File]::WriteAllBytes($archive, [System.Convert]::FromBase64String($b64))
          $baseActual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseExpected = '3b40b0bd7551b1fbb07349c8432847f8b12964ff6665d3b684bb89d4d0a4db85'
          if ($baseActual -ne $baseExpected) { throw "Base source archive hash mismatch: $baseActual" }
          tar -xf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed: $LASTEXITCODE" }

          # Apply the one tracked regression-harness correction, then verify ALL 78 source files.
          Copy-Item "$env:GITHUB_WORKSPACE\bootstrap\overrides\smoke-binaries.ps1" "$env:GITHUB_WORKSPACE\projects\Poster2PSD-V2\02_SOURCE\scripts\smoke-binaries.ps1" -Force
          $manifest = "$env:GITHUB_WORKSPACE\bootstrap\SOURCE-FILES-alpha2-r2.sha256"
          $manifestLines = Get-Content $manifest
          $canonicalManifestText = ($manifestLines -join "`n") + "`n"
          $canonicalManifestBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($canonicalManifestText)
          $manifestActual = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($canonicalManifestBytes)).ToLowerInvariant()
          $manifestExpected = '3bbaccae6af53d1c550e3c87de52877098fd3d5b525cc2e8cddc96b67e2f9609'
          if ($manifestActual -ne $manifestExpected) { throw "Canonical source manifest hash mismatch: $manifestActual" }

          $verified = 0
          foreach ($line in $manifestLines) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Malformed source manifest line: $line" }
            $expected = $parts[0].ToLowerInvariant()
            $rel = $parts[1].Trim().Replace('/', [System.IO.Path]::DirectorySeparatorChar)
            $path = Join-Path $env:GITHUB_WORKSPACE $rel
            if (!(Test-Path $path -PathType Leaf)) { throw "Source file missing: $rel" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Source file hash mismatch: $rel expected=$expected actual=$actual" }
            $verified++
          }
          if ($verified -ne 78) { throw "Expected 78 source files, verified $verified" }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\projects\Poster2PSD-V2\Poster2PSD.sln")) { throw 'Poster2PSD.sln missing' }

          "POSTER2PSD_SOURCE_SHA256=$manifestActual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CANONICAL_SOURCE_FILE_COUNT=$verified"
          Write-Host "CANONICAL_SOURCE_MANIFEST_SHA256=$manifestActual"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: SOURCE REGRESSION
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\source-regression.ps1

      - name: Build Windows self-contained release payload
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\build-release.ps1 -Version '0.1.0-alpha.2' -SourceSnapshotSha256 $env:POSTER2PSD_SOURCE_SHA256

      - name: EXE ARTIFACT REGRESSION
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\smoke-binaries.ps1 -Version '0.1.0-alpha.2'

      - name: Development Package source plus EXE validation
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: .\02_SOURCE\scripts\validate-package.ps1 -Version '0.1.0-alpha.2' -SourceSnapshotSha256 $env:POSTER2PSD_SOURCE_SHA256

      - name: Collect regression evidence
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: |
          New-Item .\04_TEST\logs -ItemType Directory -Force | Out-Null
          Get-ChildItem -Recurse -Filter *.trx | Copy-Item -Destination .\04_TEST\logs -Force
          @"
          # Alpha 0.1.0-alpha.2 Dual Regression Report

          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_RUN_ID
          Canonical source manifest SHA-256: $env:POSTER2PSD_SOURCE_SHA256

          ## Source regression
          | Gate | Status |
          |---|---|
          | 78-file canonical source integrity | PASS |
          | JSON / XML / XAML parse | PASS |
          | UXP JavaScript syntax | PASS |
          | .NET 10 restore | PASS |
          | NuGet vulnerable dependency audit | PASS |
          | Release solution build, warnings as errors | PASS |
          | xUnit tests | PASS |

          ## EXE artifact regression
          | Gate | Status |
          |---|---|
          | win-x64 self-contained publish | PASS |
          | 9 Windows PE executable checks | PASS |
          | 9 executable self-tests | PASS |
          | ProductVersion alpha.2 checks | PASS |
          | root/payload binary hash parity | PASS |
          | isolated fresh install | PASS |
          | stable Launcher probe | PASS |
          | repair | PASS |
          | uninstall | PASS |
          | user data preservation sentinel | PASS |
          | FILE-HASHES.sha256 recomputation | PASS |
          | source + EXE manifest batch match | PASS |

          ## Physical-host gates
          | Gate | Status |
          |---|---|
          | Photoshop real UXP handshake | NOT VERIFIED — GitHub runner has no Photoshop |
          | Photoshop real PSD create/modify | NOT VERIFIED — GitHub runner has no Photoshop |
          | Signed updater / rollback | NOT IMPLEMENTED — S0 hardening pending |
          "@ | Set-Content .\04_TEST\regression-report.md -Encoding utf8

      - name: Assemble source and EXE delivery ZIPs
        shell: pwsh
        working-directory: projects/Poster2PSD-V2
        run: |
          $dev = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.2-Development-Package.zip'
          Compress-Archive -Path .\01_PLAN,.\02_SOURCE,.\03_BUILD,.\04_TEST,.\05_RELEASE,.\06_DOCS,.\Poster2PSD.sln,.\README.md,.\global.json,.\Directory.Build.props -DestinationPath $dev -Force
          Copy-Item $dev .\Poster2PSD-V2-0.1.0-alpha.2-Development-Package.zip

          $exe = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.2-Windows-EXE.zip'
          Compress-Archive -Path .\03_BUILD\* -DestinationPath $exe -Force
          Copy-Item $exe .\Poster2PSD-V2-0.1.0-alpha.2-Windows-EXE.zip

          $source = Join-Path $env:RUNNER_TEMP 'Poster2PSD-V2-0.1.0-alpha.2-Source.zip'
          Compress-Archive -Path .\01_PLAN,.\02_SOURCE,.\05_RELEASE,.\06_DOCS,.\Poster2PSD.sln,.\README.md,.\global.json,.\Directory.Build.props -DestinationPath $source -Force
          Copy-Item $source .\Poster2PSD-V2-0.1.0-alpha.2-Source.zip

          Get-FileHash .\Poster2PSD-V2-0.1.0-alpha.2-*.zip -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content .\04_TEST\delivery-zip-hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Poster2PSD-V2-0.1.0-alpha.2-Dual-Regression
          path: |
            projects/Poster2PSD-V2/Poster2PSD-V2-0.1.0-alpha.2-Development-Package.zip
            projects/Poster2PSD-V2/Poster2PSD-V2-0.1.0-alpha.2-Windows-EXE.zip
            projects/Poster2PSD-V2/Poster2PSD-V2-0.1.0-alpha.2-Source.zip
            projects/Poster2PSD-V2/03_BUILD/**
            projects/Poster2PSD-V2/04_TEST/**
            projects/Poster2PSD-V2/05_RELEASE/**
          if-no-files-found: error
          retention-days: 14
